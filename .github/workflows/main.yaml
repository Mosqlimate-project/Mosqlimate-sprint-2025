name: main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0


    - name: Install OpenGL
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev libxt-dev

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        environment-file: conda/dev.yaml
        channels: conda-forge,nodefaults
        activate-environment: sprint.mosqlimate.io
        auto-update-conda: true
        conda-solver: libmamba
    - name: Install Dart Sass
      run: |
        curl -L https://github.com/sass/dart-sass/releases/download/1.97.3/dart-sass-1.97.3-linux-x64.tar.gz -o dart-sass.tar.gz
        tar -xzf dart-sass.tar.gz
        mv dart-sass "$RUNNER_TEMP/dart-sass"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

    - name: Build Hugo
      working-directory: pages
      run: |
        hugo --gc --minify --baseURL https://sprint.mosqlimate.org/
        cp CNAME public/

    # Push the book's HTML to github-pages
    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.5.9
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: pages/public
